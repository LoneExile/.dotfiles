# Secrets for the Proxmox VM unit (infra/proxmox/vms).
# Values live in homelab OpenBao at secret/secretspec/dotfiles-infra/default/<KEY>.
# This manifest is separate from the root secretspec.toml because of the
# materialize.sh contract: that script materializes every key of the root
# manifest onto disk, and these keys must never land there.
# No [providers] section: the user default (openbao) applies.

[project]
name = "dotfiles-infra"
revision = "1.0"

[profiles.default]
TF_VAR_proxmox_endpoint = { description = "Proxmox API URL, https://<endpoint>:8006/", required = true }
TF_VAR_proxmox_api_token = { description = "Proxmox API token in the full user@realm!id=secret form", required = true }
TF_VAR_proxmox_insecure = { description = "Skip TLS verification of the Proxmox API (true or false)", required = true }
TF_VAR_image_datastore = { description = "Directory datastore that accepts import content", required = true }
TF_VAR_vm_datastore = { description = "Block datastore for VM disks", required = true }
TF_VAR_network_bridge = { description = "Bridge for the first network device", required = true }
TF_VAR_vms = { description = "JSON map of VM name to node, vmid, mac, ipv4_cidr, gateway, dns, cores, memory_mb, disk_gb and an optional role (clean, the default, or agent)", required = true }
TF_VAR_ssh_authorized_keys = { description = "Newline-separated SSH public keys, referenced from the root manifest", required = true, ref = { item = "secretspec/dotfiles/default/SSH_ID_ED25519_PUB", field = "value" } }
TF_VAR_tofu_state_passphrase = { description = "OpenTofu state encryption passphrase, generated locally", required = true }
AWS_ACCESS_KEY_ID = { description = "S3 access key id of the dedicated state user (read natively by the OpenTofu s3 backend)", required = true }
AWS_SECRET_ACCESS_KEY = { description = "S3 secret key of that user (read natively by the OpenTofu s3 backend)", required = true }
TF_STATE_S3_ENDPOINT = { description = "S3 endpoint URL of the state store, http://<endpoint>:<port>", required = true }
TF_STATE_S3_BUCKET = { description = "Bucket that holds the OpenTofu state, under the prefix dotfiles-infra/", required = true }
VM_LUKS_KEYS = { description = "JSON map of VM name to the LUKS passphrase of its root disk, generated by vm-install (seed with {})", required = true }
VM_INITRD_HOST_KEYS = { description = "JSON map of VM name to the public key of its initrd SSH host key, written by vm-install; pins the unlock connection (seed with {})", required = true }

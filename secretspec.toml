# SecretSpec project manifest — https://secretspec.dev
#
# Declarations only, no secret values. Values live in OpenBao at
# secret/secretspec/dotfiles/default/<NAME>, shared across machines via the
# homelab vault (provider alias `openbao` in home/secretspec/config.toml).
#
# `dotfiles-secrets` (home/secretspec/materialize.sh) keeps the 14 files below
# in sync with OpenBao; its own table of names, paths and modes must list the
# same names as this file, ATUIN_PASSWORD excepted (a test checks). It runs from
# home.activation.secretspecSecrets (home/default.nix) on every `just home` /
# `just switch`; `just secretspec-sync` reviews and pushes.
#
# New machine bootstrap: `just openbao-login`, then `just switch`. The secretspec
# CLI (curl -sSL https://install.secretspec.dev | sh) is only needed for the
# atuin login (ATUIN_PASSWORD) and the contract check in `just secretspec-status`.

[project]
name = "dotfiles"
revision = "1.0"

[profiles.default]
SSH_ID_ED25519 = { description = "~/.ssh/id_ed25519 (main key)", required = true }
SSH_ID_ED25519_PUB = { description = "~/.ssh/id_ed25519.pub", required = true }
SSH_ID_ED25519_OC = { description = "~/.ssh/id_ed25519.oc", required = true }
SSH_ID_ED25519_OC_PUB = { description = "~/.ssh/id_ed25519.oc.pub", required = true }
SSH_ID_ED25519_UNIT_PX = { description = "~/.ssh/id_ed25519_unit_px", required = true }
SSH_ID_CRYPT = { description = "~/.ssh/id_crypt (homelab)", required = true }
SSH_ID_CRYPT_PUB = { description = "~/.ssh/id_crypt.pub", required = true }
SSH_LINE_PAYMENT_GATEWAY = { description = "~/.ssh/line-payment-gateway", required = true }
SSH_LINE_PAYMENT_GATEWAY_PUB = { description = "~/.ssh/line-payment-gateway.pub", required = true }
ATUIN_KEY = { description = "atuin history encryption key (~/.local/share/atuin/key)", required = true }
NPMRC = { description = "~/.npmrc (npm registry auth token)", required = true }
ATUIN_AI_TOKEN = { description = "atuin-ai-server bearer token (~/.config/atuin/ai-token); zsh/bash export it as ATUIN_AI__API_TOKEN", required = true }
OMP_ENV = { description = "~/.omp/.env (OMP provider API keys)", required = true }
TOFU_BACKBONE_CLUSTER_PASS = { description = "~/.config/tofu/backbone-cluster.pass", required = true }
ATUIN_PASSWORD = { description = "atuin sync password for loneexile; home/secretspec/atuin-login.sh passes it to `atuin login` only when logged out, never on disk", required = true }


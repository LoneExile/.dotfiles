# shellcheck shell=bash disable=SC2034
# rex's root settings, applied by hosts/linux/arch-system.sh (`just arch-system`, checked by `just arch-check`).
# Bash, sourced by the script. No server values here: the LAN subnets are UFW_SUBNETS in
# ~/.config/dotfiles/arch-system.env on the host (README: Non-NixOS Linux hosts).

# System units to enable and start, and ones to keep disabled and stopped.
SYSTEM_UNITS=(
  nix-daemon.socket
  btrfs-scrub@-.timer # monthly scrub of /
  paccache.timer      # weekly: keep 3 versions of each package
  docker.socket       # Docker on first use; `sudo docker`, no docker group (it equals root)
)
SYSTEM_UNITS_OFF=(
  warp-svc.service # the WARP package enables it; on only when WARP is wanted, as a connect reroutes rex
)

# User units of the login user (`arch-system.sh user`).
USER_UNITS=(
  app-dev.lizardbyte.app.Sunshine.service
  syncthing.service
)

# The user services (Tern, the install services) run without a login session.
LINGER=yes
LOGIN_SHELL=/usr/bin/zsh

# SSH with keys only, through a drop-in read before CachyOS's own (sshd keeps the first value it reads).
SSHD_KEYS_ONLY=yes

# The Mac's Nix settings (lib/builders.nix), set in /etc/nix/nix.conf.
NIX_CONF=(
  "experimental-features = nix-command flakes"
  "substituters = https://cache.nixos.org https://nix-community.cachix.org"
  "trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs="
)

# greetd logs the user in once per boot with this command (the same as hyprland-uwsm.desktop).
GREETD_AUTOLOGIN="uwsm start -e -D Hyprland hyprland.desktop"

# NetworkManager connection that keeps Wake-on-LAN (magic packet) on.
WOL_CONNECTION="Wired connection 1"

# ufw rules, each allowed from every subnet in UFW_SUBNETS: "proto ports comment".
UFW_RULES=(
  "tcp 47984,47989,48010 sunshine"
  "udp 47998:48000 sunshine"
  "udp 8376 tern"
)

symbolPreset: nerd
theme:
  dark: dark-gruvbox
  light: light
setupVersion: 2
statusLine:
  transparent: true
  preset: custom
  compactThinkingLevel: false
  showHookStatus: true
  separator: none
  leftSegments:
    - pi
    - model
    - mode
    - collab
    - path
    - git
    - pr
    - context_pct
    - token_rate
  rightSegments:
    - session_name
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
modelRoles:
  slow: cursor-sdk/grok-4.7@500k@slow:xhigh
  plan: xai-oauth/grok-4.7:xhigh
  vision: cursor/grok-4.7-medium:medium
  smol: cursor-sdk/grok-4.7@500k@slow:low
  tiny: anthropic/claude-haiku-4-5:off
  commit: anthropic/claude-haiku-4-5:off
  advisor: cursor-sdk/grok-4.7@500k@slow:medium
  default: cursor-sdk/grok-4.7@500k@slow:xhigh
  task: cursor-sdk/grok-4.7@500k@slow:high
  web: xai/grok-4.5
  image: xai/grok-imagine-image
task:
  agentModelOverrides:
    sdd-implementer: anthropic/claude-sonnet-5-5:high
    sdd-reviewer: anthropic/claude-sonnet-5-5:high
    sdd-rereviewer: anthropic/claude-sonnet-5-5:low
    sdd-escalation-implementer: anthropic/claude-sonnet-5-5:max
    sdd-final-reviewer: anthropic/claude-sonnet-5-5:max
providers:
  streamIdleTimeoutSeconds: 300
  anthropic:
    serverSideFallback: true
retry:
  modelFallback: true
  usageAwareFallback: false
  usageReservePct: 5
  fallbackChains:
    anthropic/*:
      - xai-oauth/grok-4.7
    xai-oauth/*:
      - anthropic/claude-opus-5-5
    web:
      - xai-oauth/grok-4.5
      - anthropic/claude-haiku-4-5
      - web/exa
      - web/duckduckgo
    image:
      - xai-oauth/grok-imagine-image
disabledProviders:
  - claude-plugins
  - codex
  - gemini
  - opencode
  - github
skills:
  enableClaudeUser: false
  customDirectories:
    - ~/.omp/plugins/node_modules/taste-skill/skills
commands:
  enableClaudeUser: false
terminal:
  showProgress: true
tui:
  tight: false
  maxInlineImageRows: 60
  maxInlineImageColumns: 240
  textSizing: true
display:
  showTokenUsage: true
  shimmer: kitt
advisor:
  enabled: true
steeringMode: one-at-a-time
autolearn:
  enabled: true
  autoContinue: false
memory:
  backend: hindsight
hindsight:
  apiUrl: https://hindsight-api.home.0dl.me
  scoping: per-project-tagged
  autoRecall: true
  autoRetain: true
  retainMode: last-turn
  retainEveryNTurns: 3
  recallBudget: mid
  mentalModelsEnabled: true
  mentalModelAutoSeed: false
bash:
  enabled: true
hideThinkingBlock: false
lsp:
  diagnosticsOnEdit: true
startup:
  quiet: true
defaultThinkingLevel: auto
dev:
  autoqaConsent: granted
compaction:
  enabled: true
  remoteStreamingV2Enabled: true
  thresholdTokens: -1
  methodOrder:
    - snapcompact
    - remote
    - soft
composer:
  shape: borderless
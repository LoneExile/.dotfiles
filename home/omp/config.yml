symbolPreset: nerd
theme:
  dark: dark-gruvbox
  light: light
setupVersion: 2
statusLine:
  transparent: true
  preset: custom
  compactThinkingLevel: false
  showHookStatus: true
  separator: none
  leftSegments:
    - pi
    - model
    - mode
    - collab
    - path
    - git
    - pr
    - context_pct
    - token_rate
  rightSegments:
    - session_name
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
modelRoles:
  slow: xai-oauth/grok-4.6:xhigh
  plan: opencode-go/deepseek-v4.1-flash:max
  vision: xai-oauth/grok-4.6:medium
  smol: opencode-go/deepseek-v4.1-flash:low
  tiny: anthropic/claude-haiku-4-5:off
  commit: anthropic/claude-haiku-4-5:off
  advisor: xai-oauth/grok-4.6:high
  default: xai-oauth/grok-4.6:xhigh
  task: xai-oauth/grok-4.6:xhigh
task:
  agentModelOverrides:
    sdd-implementer: opencode-go/deepseek-v4.1-flash:high
    sdd-reviewer: opencode-go/deepseek-v4.1-flash:high
    sdd-rereviewer: opencode-go/deepseek-v4.1-flash:low
    sdd-escalation-implementer: opencode-go/deepseek-v4.1-flash:max
    sdd-final-reviewer: opencode-go/deepseek-v4.1-flash:max
providers:
  webSearchOrder:
    - xai
    - perplexity
    - gemini
    - anthropic
    - codex
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
  streamIdleTimeoutSeconds: 300
  anthropic:
    serverSideFallback: true
  imageOrder:
    - xai
retry:
  modelFallback: false
  usageAwareFallback: false
  usageReservePct: 5
  fallbackChains:
    anthropic/claude-fable-5:
      - anthropic/claude-opus-5
      - xai-oauth/grok-4.5
      - openrouter/openai/gpt-5.6-sol
    anthropic/claude-mythos-5:
      - anthropic/claude-opus-5
      - xai-oauth/grok-4.5
      - openrouter/openai/gpt-5.6-sol
    anthropic/claude-opus-5:
      - xai-oauth/grok-4.5
      - openrouter/deepseek/deepseek-v4-pro
      - openrouter/xiaomi/mimo-v2.5-pro
    anthropic/claude-sonnet-5:
      - xai-oauth/grok-4.5
      - openrouter/deepseek/deepseek-v4-pro
      - openrouter/xiaomi/mimo-v2.5
    anthropic/claude-haiku-4-5:
      - xai-oauth/grok-4.3
      - openrouter/xiaomi/mimo-v2.5
disabledProviders:
  - claude-plugins
  - codex
  - gemini
  - opencode
  - github
skills:
  enableClaudeUser: false
  customDirectories:
    - /Users/lex/.omp/plugins/node_modules/taste-skill/skills
commands:
  enableClaudeUser: false
terminal:
  showProgress: true
tui:
  tight: false
  maxInlineImageRows: 60
  maxInlineImageColumns: 240
  textSizing: true
display:
  showTokenUsage: true
  shimmer: kitt
advisor:
  enabled: true
steeringMode: one-at-a-time
autolearn:
  enabled: true
  autoContinue: false
memory:
  backend: hindsight
hindsight:
  apiUrl: https://hindsight-api.home.0dl.me
  scoping: per-project-tagged
  autoRecall: true
  autoRetain: true
  retainMode: last-turn
  retainEveryNTurns: 3
  recallBudget: mid
  mentalModelsEnabled: true
  mentalModelAutoSeed: true
bash:
  enabled: true
hideThinkingBlock: false
lsp:
  diagnosticsOnEdit: true
startup:
  quiet: true
defaultThinkingLevel: auto
dev:
  autoqaConsent: granted
compaction:
  enabled: true
  remoteStreamingV2Enabled: true
  thresholdTokens: -1
  methodOrder:
    - snapcompact
    - remote
    - soft
composer:
  shape: borderless
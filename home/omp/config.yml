symbolPreset: nerd
theme:
  dark: dark-gruvbox
  light: light
setupVersion: 2
statusLine:
  transparent: true
  preset: custom
  compactThinkingLevel: false
  showHookStatus: true
  separator: none
  leftSegments:
    - pi
    - model
    - mode
    - collab
    - path
    - git
    - pr
    - context_pct
    - token_rate
  rightSegments:
    - session_name
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
modelRoles:
  slow: xai-oauth/grok-4.6:xhigh
  plan: opencode-go/deepseek-v4.1-flash:max
  vision: xai-oauth/grok-4.6:medium
  smol: cursor/gpt-5.6-luna:low
  tiny: anthropic/claude-haiku-4-5:off
  commit: anthropic/claude-haiku-4-5:off
  advisor: xai-oauth/grok-4.7
  default: anthropic/claude-fable-5-1:max
  task: xai-oauth/grok-4.7
  web: xai/grok-4.5
  image: xai/grok-imagine-image
task:
  agentModelOverrides:
    sdd-implementer: opencode-go/deepseek-v4.1-flash:high
    sdd-reviewer: opencode-go/deepseek-v4.1-flash:high
    sdd-rereviewer: opencode-go/deepseek-v4.1-flash:low
    sdd-escalation-implementer: opencode-go/deepseek-v4.1-flash:max
    sdd-final-reviewer: opencode-go/deepseek-v4.1-flash:max
providers:
  streamIdleTimeoutSeconds: 300
  anthropic:
    serverSideFallback: true
retry:
  modelFallback: false
  usageAwareFallback: false
  usageReservePct: 5
  fallbackChains:
    anthropic/claude-fable-5:
      - anthropic/claude-opus-5
      - xai-oauth/grok-4.5
      - openrouter/openai/gpt-5.6-sol
    anthropic/claude-mythos-5:
      - anthropic/claude-opus-5
      - xai-oauth/grok-4.5
      - openrouter/openai/gpt-5.6-sol
    anthropic/claude-opus-5:
      - xai-oauth/grok-4.5
      - openrouter/deepseek/deepseek-v4-pro
      - openrouter/xiaomi/mimo-v2.5-pro
    anthropic/claude-sonnet-5:
      - xai-oauth/grok-4.5
      - openrouter/deepseek/deepseek-v4-pro
      - openrouter/xiaomi/mimo-v2.5
    anthropic/claude-haiku-4-5:
      - xai-oauth/grok-4.3
      - openrouter/xiaomi/mimo-v2.5
    web:
      - web/perplexity
      - google/gemini-2.5-flash
      - anthropic/claude-haiku-4-5
      - openai-codex/gpt-5.6-luna
      - web/zai
      - web/exa
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/parallel
      - web/synthetic
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
      - google-antigravity/gemini-2.5-flash
      - openai-codex/gpt-5.6
      - openai-codex/gpt-5.5
      - xai-oauth/grok-4.5
      - web/ollama
    image:
      - openai/gpt-image-1
      - openai-codex/gpt-image-1
      - google-antigravity/gemini-3-pro-image
      - xai-oauth/grok-imagine-image
      - openrouter/google/gemini-3-pro-image-preview
      - google/gemini-3-pro-image-preview
      - deepinfra/black-forest-labs/FLUX-2-pro
disabledProviders:
  - claude-plugins
  - codex
  - gemini
  - opencode
  - github
skills:
  enableClaudeUser: false
  customDirectories:
    - /Users/lex/.omp/plugins/node_modules/taste-skill/skills
commands:
  enableClaudeUser: false
terminal:
  showProgress: true
tui:
  tight: false
  maxInlineImageRows: 60
  maxInlineImageColumns: 240
  textSizing: true
display:
  showTokenUsage: true
  shimmer: kitt
advisor:
  enabled: true
steeringMode: one-at-a-time
autolearn:
  enabled: true
  autoContinue: false
memory:
  backend: hindsight
hindsight:
  apiUrl: https://hindsight-api.home.0dl.me
  scoping: per-project-tagged
  autoRecall: true
  autoRetain: true
  retainMode: last-turn
  retainEveryNTurns: 3
  recallBudget: mid
  mentalModelsEnabled: true
  mentalModelAutoSeed: true
bash:
  enabled: true
hideThinkingBlock: false
lsp:
  diagnosticsOnEdit: true
startup:
  quiet: true
defaultThinkingLevel: auto
dev:
  autoqaConsent: granted
compaction:
  enabled: true
  remoteStreamingV2Enabled: true
  thresholdTokens: -1
  methodOrder:
    - snapcompact
    - remote
    - soft
composer:
  shape: borderless
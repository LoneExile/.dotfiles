  # --- OmniRoute — second OpenAI-compatible gateway on backbone-cluster, running
  #   ALONGSIDE litellm (evaluation: it does quota-aware auto-fallback across a
  #   huge provider pool, which litellm does not). Runtime SQLite state, no
  #   declarative config in git — re-sync this list from the live gateway if the
  #   pool changes (GET /v1/models with your key).
  #   LAN-only ungated API route: https://omniroute-api.home.0dl.me/v1 (Envoy
  #   TLS). REQUIRE_API_KEY=true is the ONLY gate on that hostname, so put an
  #   OmniRoute API key (minted in the dashboard, api_keys table) in
  #   ~/.omp/.env as OMNIROUTE_API_KEY. Keep that key for inference only and
  #   never hand it to an in-cluster consumer pointing at the Service directly:
  #   on /v1/* every valid key can also mint/revoke keys (scopes are not
  #   consulted on /api/v1/*) — the Envoy path-allowlist is the real control.
  #   The six ids are OmniRoute's README-documented zero-config VIRTUAL combos
  #   ("auto" variants). A combo's context/max-token limits and per-token cost
  #   depend on whichever pool member answers a given request, so those fields
  #   are intentionally omitted (optional in OMP's schema) rather than guessed.
  omniroute:
    baseUrl: https://omniroute-api.home.0dl.me/v1
    apiKey: OMNIROUTE_API_KEY
    api: openai-completions
    auth: apiKey
    models:
      - id: auto
        name: OmniRoute Auto (balanced LKGP)
      - id: auto/coding
        name: OmniRoute Auto (coding)
      - id: auto/fast
        name: OmniRoute Auto (fast)
      - id: auto/cheap
        name: OmniRoute Auto (cheap)
      - id: auto/offline
        name: OmniRoute Auto (offline)
      - id: auto/smart
        name: OmniRoute Auto (smart)
  # --- OpenCode Go — flat-rate SUBSCRIPTION gateway (opencode.ai). The catalog
  #     is BUNDLED in OMP (provider `opencode-go`, baseUrl
  #     https://opencode.ai/zen/go/v1) and the key is read automatically from
  #     OPENCODE_API_KEY in .env — no models: list needed. The bundled entries
  #     carry ZEN PAY-AS-YOU-GO rates, which would overstate spend for a Go
  #     subscriber, so this override block zeroes them (cline-pass convention:
  #     cost:0 = drawn from your plan, not per-token). Live-verified 2026-08-04:
  #     every id below answered a real request on the Go endpoint; mimo-v2-pro /
  #     mimo-v2-omni / hy3-preview are advertised by /v1/models but currently
  #     400/500 upstream ("Unsupported model" / "ModelNotFound") and are left
  #     as-is in the catalog. opencode-zen is the separate pay-as-you-go catalog
  #     — untouched, keeps its real per-token rates.
  #     2026-09-10 audit (source: https://opencode.ai/docs/go): the "flat-rate"
  #     wording above is imprecise. Go is $10/mo whose entitlement is a PER-MODEL
  #     MONTHLY DOLLAR CAP ($15/$30/$60 by model), burned at real token prices
  #     (5-hour = 20% of monthly, weekly = 50%). This applies to EVERY id below,
  #     not just the newest one. cost:0 stops sessions reporting notional spend
  #     but equally hides cap burn — and a per-token cost cannot express a
  #     monthly cap either way, so this is a reporting choice, not a fix. Kept
  #     uniform on purpose: change it for the whole block or not at all.
  #     `deepseek-flash` = DeepSeek V4.1 Flash (docs Endpoints table maps the
  #     display name to this id; OMP lists ids, so "V4.1" never appears in
  #     `omp models`). 1M ctx / 384k out, effort thinking, chat/completions,
  #     cap $15, off-peak $0.15/$0.60/$0.003, PEAK 2x during 01:00-04:00 and
  #     06:00-10:00 UTC Mon-Fri. Discovery-only: the literal id appears 0 times
  #     in @oh-my-pi/pi-catalog/src/models.json — it arrives via runtime
  #     discovery (agent/models.db model_cache, `opencode-go:models-v3:<credfp>`)
  #     so it is NOT pinned with a `models:` entry that would shadow the refresh.
  #     Live-verified 2026-09-10: GET /v1/models (36 ids) + a real reply from
  #     `omp -p --model opencode-go/deepseek-flash --thinking=high` (effort is
  #     the --thinking flag; a `:high` id suffix does not resolve for this id).
  #     Beware: provider `deepseek` (api.deepseek.com) caches a DIFFERENT
  #     `deepseek-flash` (reasoning:false, null limits) — always fully qualify.
  opencode-go:
    modelOverrides:
      deepseek-flash: { cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 } }
      deepseek-v4-flash: { cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 } }
      deepseek-v4-pro: { cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 } }
      # DeepSeek V4.1 Flash ships image input in the provider's discovery payload
      # (omp models ls --json → input:[text,image]) but OMP's resolved compat for
      # this provider still sets stripImageInput, so the table showed images=no and
      # pastes got "[image omitted: model does not support vision]". Cleared here
      # (2026-09-11). Revert this compat line if upstream rejects image payloads.
      deepseek-v4.1-flash: { compat: { stripImageInput: false } }
      glm-5: { cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 } }
      glm-5.1: { cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 } }
      glm-5.2: { cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 } }

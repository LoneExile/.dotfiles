        cost: { input: 2, output: 6, cacheRead: 0.2, cacheWrite: 0 }
      grok-build:
        cost: { input: 1, output: 2, cacheRead: 0.2, cacheWrite: 0 }
      grok-build-0.1:
        cost: { input: 1, output: 2, cacheRead: 0.2, cacheWrite: 0 }
      # grok-composer-2.5-fast intentionally left at cost:0 — xAI publishes no

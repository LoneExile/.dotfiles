  # Cline — OpenAI-compatible gateway at api.cline.bot/api/v1, one CLINE_API_KEY.
  # Endpoint + IDs live-verified 2026-07-20. Streaming = standard OpenAI SSE.
  # TWO billing paths on the SAME key (server decides by model id):
  #  * Frontier/plain ids (anthropic/*, openai/*, google/*, z-ai/glm-4.6,
  #    moonshotai/kimi-k3, deepseek/*, qwen/*, minimax/*) = USAGE-BILLING =>
  #    drawn from your Cline CREDITS (app.cline.bot). cost:0 below is a
  #    placeholder; real spend is metered by Cline, watch your credit balance.
  #  * "cline-pass/<model>" ids = your ClinePass SUBSCRIPTION ($9.99/mo). The
  #    covered set (kimi family + minimax below) returns cost:0 = NO credits,
  #    metered against ClinePass 5h/weekly/monthly rate limits instead. NOTE:
  #    cline-pass/glm-5.2 and cline-pass/deepseek-v4-* currently route to a

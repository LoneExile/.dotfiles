  # --- xAI Grok via the SuperGrok OAuth path (`xai-oauth`).
  #     OMP's bundled catalog ships every xai-oauth model at cost:0 because the
  #     SuperGrok subscription is flat-rate, so the dashboard reported $0.00 for
  #     ~6.4M grok-4.5 tokens/day. These overrides restore xAI's published API
  #     list prices (docs.x.ai/developers/pricing, verified 2026-07-26) so cost
  #     accounting is comparable to the metered providers above.
  #     NOTE: this is NOTIONAL "equivalent API spend" — the subscription does not
  #     bill per token, and xAI's long-context tier (>=200k prompt: 2x rates on
  #     grok-4.5) is not modelled, so real long-context turns under-report.
  #     Override-only block: no `models:` key, so built-in entries are kept.
  xai-oauth:
    modelOverrides:
      grok-4.5:
        cost: { input: 2, output: 6, cacheRead: 0.3, cacheWrite: 0 }
      grok-4.3:
        cost: { input: 1.25, output: 2.5, cacheRead: 0.2, cacheWrite: 0 }
      grok-4.20-0309-reasoning:
        cost: { input: 1.25, output: 2.5, cacheRead: 0.2, cacheWrite: 0 }
      grok-4.20-0309-non-reasoning:
        cost: { input: 1.25, output: 2.5, cacheRead: 0.2, cacheWrite: 0 }
      grok-4.20-multi-agent-0309:
        cost: { input: 2, output: 6, cacheRead: 0.2, cacheWrite: 0 }
      grok-build:
        cost: { input: 1, output: 2, cacheRead: 0.2, cacheWrite: 0 }
      grok-build-0.1:
        cost: { input: 1, output: 2, cacheRead: 0.2, cacheWrite: 0 }
      # grok-composer-2.5-fast intentionally left at cost:0 — xAI publishes no
      # list price for it, and a guessed rate is worse than a known zero.

  #   are added. The two ids are UNRELATED specs/pricing.
  #   DeepSeek V4 Flash 0731: id deepseek/deepseek-v4-flash-0731 (exact
  #   catalog name "DeepSeek: DeepSeek V4 Flash 0731"). text-only input.
  #   Catalog context_length 1,310,720 vs top_provider 1,048,576 — use the
  #   serving ceiling. max output 393,216, capped to house 32768. Reasoning
  #   ON by default (mandatory=false, default_effort high, efforts
  #   max/high/low — no "none" in the catalog list, but disable is allowed
  #   via mandatory=false). Catalog LIST (pricing.original) per 1M: input
  #   $0.07, output $0.14, cached-input $0.014. Current catalog promo is
  #   $0.04/$0.128/$0.0104 — not modelled, so real spend may read lower
  #   while the promo lasts. Live probes returned is_byok=true and a
  #   rounded usage.cost floor ($0.00005) that does NOT cross-multiply
  #   against either catalog rate, so LIST is used. No cache-write rate
  #   published -> cacheWrite:0.
  #   GLM 5.3 Flash: id z-ai/glm-5.3-flash (exact catalog name "Z.ai: GLM
  #   5.3 Flash"). Input modality is [text, image, video] per catalog;
  #   this file only models [text, image]. Serving context 1,048,576 (same
  #   top_provider vs advertised 1,310,720 split). max output 131,072,
  #   capped to house 32768. Reasoning MANDATORY (disable_supported=false,
  #   default_effort max, efforts max/high/low only). cost: is catalog
  #   LIST (pricing.original) per 1M: input $0.0713, output $0.2375,
  #   cached-input $0.0142 — same field as DeepSeek, not current
  #   $0.057/$0.19/$0.0114 (promo, not modelled). Live usage.cost ran
  #   higher than list (17in/37out billed $1.0525e-05; 17in/18out with
  #   reasoning_effort:high billed $1.155e-05) — not a unique rate, not
  #   used on cost:.
  #   No cache-write rate published -> cacheWrite:0.
  #   :batch / :US / ~latest / vision-exp / glm-5.3 (non-flash) siblings
  #   are deliberately omitted.
  #   No compat block: live chat/completions 2026-09-07 confirmed OMP's
  #   unknown-host defaults (store:false + max_completion_tokens) and
  #   reasoning_effort=high are accepted (HTTP 200) on both ids.
  nousresearch:
    baseUrl: https://inference-api.nousresearch.com/v1
    apiKey: NOUSRESEARCH_TOKEN
    api: openai-completions
    auth: apiKey

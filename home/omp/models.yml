  #   Completions-compatible at https://api.apodex.ai/v1. Key in .env as
  #   APODEX_KEY, sent as a Bearer token. NOT bundled in OMP as of 2026-08-25
  #   (verified absent via `omp models` grep). Two text-only core models, both
  #   262,144-token context; ids + prices from platform.apodex.ai/docs/models.
  #   Per-1M LIST prices: in / cached-input(=cacheRead) / out. No separate
  #   cache-write rate is published (billing is input/cached-input/output), so
  #   cacheWrite:0. NOTE: requests with >200K input tokens are billed at 2x the
  #   listed rates for the whole request — that long-context multiplier is NOT
  #   modelled here, so very-long-context turns under-report.
  #   Reasoning is ON by default (reasoning_content) and counts toward
  #   max_tokens; leave >=1024 headroom (OMP streams, so the 32768 non-stream
  #   cap does not bite). The deep-research tiers on the same /v1/chat/
  #   completions path are deliberately EXCLUDED: they ignore sampling params,
  #   run for minutes, and return HTTP 200 even on failure — not OpenAI-plain.
  apodex:
    baseUrl: https://api.apodex.ai/v1
    apiKey: APODEX_KEY
    api: openai-completions
    auth: apiKey
    # OMP treats api.apodex.ai as an unknown host and would default to the
    # OpenAI-current wire (store:false + max_completion_tokens). Apodex ACCEPTS
    # those (verified live 2026-08-25: store, max_completion_tokens and
    # reasoning_effort each returned 200), but its docs specify `max_tokens`
    # and never document `store` on chat completions — so align to the
    # documented contract for robustness if Apodex later tightens validation.
    # supportsReasoningEffort is deliberately LEFT ON (default true): both
    # models are reasoning models that accept + honor reasoning_effort, so the
    # thinking-level selector keeps controlling reasoning depth.
    compat:
      supportsStore: false
      maxTokensField: max_tokens
    models:
      - id: apodex-1.1
        name: Apodex 1.1
        reasoning: true
        input: [text]
        contextWindow: 262144
        maxTokens: 32768
        cost: { input: 0.24, output: 2.40, cacheRead: 0.024, cacheWrite: 0 }
      - id: apodex-1.1-mini
        name: Apodex 1.1 Mini
        reasoning: true
        input: [text]
        contextWindow: 262144
        maxTokens: 32768

  #   maxTokens on both capped at the file's usual 32768 house value (real
  #   ceilings are ~131K on both; OMP streams, so a lower non-stream cap
  #   doesn't bite). Neither model publishes a separate cache-write rate,
  #   so cacheWrite:0 on both.
  #   No compat block needed for either: real chat completions probed
  #   2026-08-27 confirmed OMP's unknown-host defaults (store:false +
  #   max_completion_tokens) and reasoning_effort are accepted (200) on
  #   both ids; each response's own reported cost matched its own rates
  #   exactly (5.3: 1.85e-05 for 17in/3out; flash: 3.24e-07 for 17in/3out).
  merge-gateway:
    baseUrl: https://api-gateway.merge.dev/v1/openai
    apiKey: MERGE_GATEWAY_KEY
    api: openai-completions
    auth: apiKey
    models:
      - id: zai/glm-5.3
        name: GLM-5.3 (Merge Gateway)
        reasoning: true
        input: [text]
        contextWindow: 1000000
        maxTokens: 32768
        cost: { input: 0.70, output: 2.20, cacheRead: 0.13, cacheWrite: 0 }
      - id: zai/glm-5.3-flash
        name: GLM-5.3 Flash (Merge Gateway)
        # Catalog now reports FOUR vendor routes for this id (zai/particle
        # at $0.015/$0.05, baseten/wafer at $0.15/$0.50) — the $0.012/$0.04
        # this entry previously carried was stale vs the current catalog.
        # Cross-multiplying 3 live calls' usage.cost exactly matches
        # $0.015/$0.05, so billing lands on the cheap pair; zai and particle
        # price identically, so cost alone cannot attribute a specific
        # vendor — treat it as the zai/particle pricing class, not one
        # named route. (Comment's vendor-route list updated 2026-09-06;
        # original was written 2026-08-27 when only 2 routes existed.)
        # Reasoning cannot be disabled on any route
        # (disable_supported=false, efforts low/high/max only).
        # Live-measured (n=3, reasoning on, sequential): TTFT 1.22-7.73s,
        # decode 89-607 tok/s — the third run is a clear outlier (7.73s
        # TTFT, 607 tok/s post-first-delta); cause is uncertain — do not
        # treat this single outlier as steady-state. The two non-outlier
        # runs sit at TTFT ~1.22-1.24s, decode ~89-118 tok/s. Small sample,
        # do not treat as stable. Input modality is actually
        # [text, image, document, video] per the catalog, but this file only
        # ever models [text, image] (no document/video precedent elsewhere),
        # so mapped to that.
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 32768
        cost: { input: 0.015, output: 0.05, cacheRead: 0.003, cacheWrite: 0 }
      - id: deepseek/deepseek-v4-flash-0731
        name: DeepSeek V4 Flash 0731 (Merge Gateway)
        # Added 2026-09-06. Catalog reports SIX vendor routes for this id
        # (deepseek/particle/baseten/makora/empiriolabs/togetherai) with
        # genuinely different pricing each — unlike zai/glm-5.3-flash above,
        # not interchangeable numbers. Cross-multiplied 3 live streamed
        # requests' own usage.cost against each route's per-token rate: all
        # matched PARTICLE exactly (29in+300out -> 2.2015e-05 ==
        # 29*0.035e-6 + 300*0.07e-6) — this is Gateway's OBSERVED routing,
        # not a documented per-model guarantee, so re-verify via cost
        # cross-multiply if pricing ever looks off. particle's specs used,
        # not deepseek's own $0.22/$0.66. particle: 1,048,576-token context,
        # 384,000 max output (capped to house 32768), text-only input (no
        # image, unlike straitly's copy of this same model id above),
        # reasoning on by default with reasoning_effort configurable (left
        # at OMP's default passthrough, no compat override). No cache-write
        # rate published -> cacheWrite:0. Live-measured: TTFT ~0.7-1.4s
        # (mostly sub-1s); completion throughput ~80-200 tok/s depending on
        # internal <thinking> length before visible content (isolated
        # content-only speed at reasoning_effort:none was ~157 tok/s).
        # Cheaper, different route to the same model than the straitly
        # entry above ($0.035/$0.07 vs $0.0585/$0.162) — not a duplicate.
        # `omp -p --model merge-gateway/deepseek/deepseek-v4-flash-0731`
        # smoke test confirmed end-to-end (real request/parse, not just
        # the raw gateway probe above).
        reasoning: true
        input: [text]
        contextWindow: 1048576
        maxTokens: 32768
        cost: { input: 0.035, output: 0.07, cacheRead: 0.007, cacheWrite: 0 }
  # --- UNITLLM — self-hosted LiteLLM gateway (LoneExile/ai-gateway fork,
  #     UnitLLM rebrand) at 192.168.50.60:4000, routing to the local
  #     vLLM on 192.168.50.10:8080. Not bundled with OMP (verified

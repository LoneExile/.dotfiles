  #   The two ids are UNRELATED specs/pricing, not variants of one number
  #   set — GLM-5.3 Flash is ~58x cheaper, not a smaller GLM-5.3.
  #   GLM-5.3 (zai vendor route): 1,000,000-token context, 131,072 max
  #   output, text-only input, tool_use output (tool calling supported),
  #   reasoning ON by default with a real reasoning_effort control
  #   (low/high/max) — so supportsReasoningEffort is left at OMP's default
  #   (on), unlike the Pi doc's blanket `compat.supportsReasoningEffort:
